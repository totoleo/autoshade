# Architecture constraints, expressed as lints.
#
# Paths are DEFINITION paths: `autoshade_gui::model::ToastKind`, not
# `crate::ToastKind`. clippy matches those, including local items.
disallowed-types = [
    { path = "egui::Context", reason = "logic/ is headless: no widget layer" },
    { path = "egui::Ui", reason = "logic/ is headless: no widget layer" },
    { path = "egui::Response", reason = "logic/ is headless: no widget layer" },
    { path = "egui::TextureHandle", reason = "logic/ is headless: no textures" },
    { path = "eframe::Frame", reason = "logic/ is headless: no frame hooks" },
    { path = "rfd::FileDialog", reason = "logic/ is headless: no dialogs" },
    { path = "autoshade_gui::model::Msg", reason = "logic/ is headless: no worker messages" },
    { path = "autoshade_gui::model::ToastKind", reason = "logic/ is headless: no toast styling" },
    { path = "autoshade_gui::app::AutoShadeApp", reason = "logic/ is headless: no root" },
    { path = "autoshade_gui::services::Services", reason = "logic/ is headless: no workers" },
]

disallowed-methods = [
    { path = "std::process::Command::new", reason = "child processes go through the shared spawn doors" },
    { path = "std::env::set_var", reason = "the config load must not write the process environment" },
    { path = "std::env::remove_var", reason = "the config load must not write the process environment" },
    { path = "std::thread::spawn", reason = "logic/ is headless: no threads" },
    { path = "rawler::get_decoder", reason = "decoder construction has one door" },
    { path = "image::ImageReader::open", reason = "baked image construction has one door" },
    { path = "dotenvy::dotenv_override", reason = "the config load must not write the process environment" },
    { path = "autoshade_gui::i18n::tr", reason = "logic/ is headless: return UiText, never a rendered sentence" },
    { path = "autoshade_gui::i18n::trf", reason = "logic/ is headless: return UiText, never a rendered sentence" },
    { path = "autoshade_gui::services::Services::spawn_worker", reason = "logic/ is headless: return an Effect" },
]
